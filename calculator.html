!DOCTYPE html>
<html>
<head>
<title>My Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#00ff88}
.calc{background:#1f2937;padding:20px;border-radius:20px;max-width:300px;margin:auto}
#display{width:100%;height:50px;font-size:28px;text-align:right;background:white;color:black;border:none;border-radius:10px;padding:5px;margin-bottom:15px}
button{width:60px;height:55px;font-size:20px;margin:4px;border:none;border-radius:10px;background:#374151;color:white;font-weight:bold}
button.orange{background:#f97316}
button.red{background:#ff0000;color:black}
button.red{background:#ef4444}
</style>
</head>
<body>
<h1>Abdulmalik's Calculator 🧮</h1>
<p>By Aloba Abdulmalik</p>

<div class="calc">
<input id="display" readonly>
<br>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')" class="orange">/</button>
<br>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')" class="orange">x</button>
<br>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')" class="orange">-</button>
<br>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="clearAll()" class="red">C</button>
<button onclick="add('+')" class="orange">+</button>
<br>
<button onclick="calc()" class="green" style="width:92%">=</button>
<button onclick="sayHi()" style="width:92%">Say Hi</button>
</div>

<br>
<a href="index.html" style="color:#00ff88">⬅ Back to Portfolio</a>

<script>
function add(v){document.getElementById('display').value += v}
function clearAll(){document.getElementById('display').value = ''}
  function sayHi(){
   document.getElementById('display').value = 'Hi Abdulmalik!'
  }
function calc(){
try{
let result = eval(document.getElementById('display').value)
document.getElementById('display').value = result
}catch{ document.getElementById('display').value = 'Error' }
}
</script>
</body>
                              </html>
