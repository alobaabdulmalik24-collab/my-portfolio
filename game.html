<!DOCTYPE html>
<html>
<head>
<title>Rock Paper Scissors</title>
<style>
body{ background:black; color:white; text-align:center; font-family:Arial; }
h1{ color:#00ff88; }
button{ font-size:20px; padding:10px; margin:5px; }
#score{ font-size:25px; color:#00ff88; }
</style>
</head>
<body>
<h1>Rock Paper Scissors ✊✋✌️</h1>
<p>By Abdulmalik</p>

<button onclick="play('Rock')">✊ Rock</button>
<button onclick="play('Paper')">✋ Paper</button>
<button onclick="play('Scissors')">✌️ Scissors</button>

<p id="result">Choose one to play!</p>
<p id="score">You: 0 - Computer: 0</p>

<script>
let playerScore = 0;
let computerScore = 0;

function play(player){
  let choices = ['Rock','Paper','Scissors'];
  let computer = choices[Math.floor(Math.random()*3)];
  let winner = "";
  if(player === computer){
    winner = "Na Draw! 🤝";
  } else if(
    (player === 'Rock' && computer === 'Scissors') ||
    (player === 'Paper' && computer === 'Rock') ||
    (player === 'Scissors' && computer === 'Paper')
  ){
    winner = "You Win! 🎉";
    playerScore++;
  } else {
    winner = "Computer Win! 😭";
    computerScore++;
  }
  document.getElementById('result').innerHTML = "You: " + player + "<br>Computer: " + computer + "<br>" + winner;
  if(winner === "You Win! 🎉"){
  document.getElementById('result').style.color = "#00ff88";
} else if(winner === "Computer Win! 😭"){
  document.getElementById('result').style.color = "red";
} else {
  document.getElementById('result').style.color = "yellow";
  }
  document.getElementById('score').innerHTML = "You: " + playerScore + " - Computer: " + computerScore;
}
</script>
</body>
</html>
