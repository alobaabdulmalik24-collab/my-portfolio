<!DOCTYPE html>
<html>
<head>
<title>Rock Paper Scissors</title>
<style>
body{background:black; color:white; text-align:center; font-family:sans-serif}
h1{color:#00ff88}
button{font-size:30px; padding:15px; margin:10px; border-radius:15px; border:none}
#result{font-size:25px; margin-top:20px}
</style>
</head>
<body>

<h1>Rock Paper Scissors ✊✋✌️</h1>
<p>By Abdulmalik</p>

<button onclick="play('Rock')">✊ Rock</button>
<button onclick="play('Paper')">✋ Paper</button>
<button onclick="play('Scissors')">✌️ Scissors</button>

<p id="result">Choose one to play!</p>

<script>
function play(player){
  let choices = ['Rock','Paper','Scissors'];
  let computer = choices[Math.floor(Math.random()*3)];

  let winner = '';
  if(player === computer){
    winner = "Na Draw! 🤝";
  } else if(
    (player === 'Rock' && computer === 'Scissors') ||
    (player === 'Paper' && computer === 'Rock') ||
    (player === 'Scissors' && computer === 'Paper')
  ){
    winner = "You Win! 🎉";
  } else {
    winner = "Computer Win! 😭";
  }

  document.getElementById('result').innerHTML = 
    "You: " + player + "<br>Computer: " + computer + "<br><b>" + winner + "</b>";
}
</script>

</body>
</html>
